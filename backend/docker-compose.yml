# 本地测试环境 PostgreSQL 17 + 首次初始化迁移。
# 仅用于本地开发/测试，禁止用于生产。生产使用 Supabase 托管 Postgres。
# 用法: docker compose up -d
# 空数据卷首次启动时，docker-init-migrations.sh 自动按 canonical allowlist 初始化。
# 已存在数据卷不会自动升级；不要对已有 BTCBOX 数据运行空库 bootstrap。
services:
  postgres:
    image: postgres:17-alpine
    container_name: btcbox-local-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: btcbox
    ports:
      - "5432:5432"
    volumes:
      - btcbox_pg_data:/var/lib/postgresql/data
      - ./supabase/sql:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts/docker-init-migrations.sh:/docker-entrypoint-initdb.d/99-run-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d btcbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  btcbox_pg_data:
